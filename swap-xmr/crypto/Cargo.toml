[package]
name = "swap-xmr-crypto"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Cross-curve DLEQ + ECDSA adaptor-signature core for TestnetSwap's BTC/LTC<->XMR atomic swaps. Compiles to WASM for the browser taker and Node maker."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ecdsa_fun = { version = "0.12", features = ["adaptor", "serde"] }
sigma_fun = { version = "0.9", features = ["ed25519", "serde", "bincode"] }
secp256kfun = { version = "0.12", features = ["serde"] }
curve25519-dalek-ng = { version = "4", features = ["u64_backend"] }
sha2 = "0.10"
rand = "0.8"
rand_chacha = "0.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
bincode = { version = "2", features = ["serde"] }
wasm-bindgen = "0.2"

# On wasm, route RNG to the browser/Node crypto via getrandom's js backend.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
